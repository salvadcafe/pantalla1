<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Salvad Café</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
}

.slide{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;

    opacity:0;
    visibility:hidden;

    transition:opacity .8s ease;
}

.slide.active{
    opacity:1;
    visibility:visible;
}

video,
img{
    position:absolute;
    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:cover;
}

</style>

</head>

<body>

<div id="videoSlide" class="slide active">

    <video
        id="promoVideo"
        autoplay
        muted
        playsinline
        webkit-playsinline>

        <source src="video.mp4" type="video/mp4">

    </video>

</div>

<div id="imageSlide" class="slide">

    <img
        src="prom_votaciones.png"
        alt="Promoción Salvad Café">

</div>

<script>

const videoSlide = document.getElementById("videoSlide");
const imageSlide = document.getElementById("imageSlide");
const video = document.getElementById("promoVideo");

function mostrarImagen() {

    videoSlide.classList.remove("active");
    imageSlide.classList.add("active");

    setTimeout(() => {

        imageSlide.classList.remove("active");
        videoSlide.classList.add("active");

        video.currentTime = 0;

        video.play().catch(err => {
            console.log(err);
        });

    }, 15000);

}

video.addEventListener("ended", mostrarImagen);

</script>

</body>
</html>
