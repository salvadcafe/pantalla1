<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SALVAD CAFÉ</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

.container{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* VIDEO VERTICAL MOSTRADO EN TV MONTADO VERTICALMENTE */
video{
    position:absolute;
    top:50%;
    left:50%;

    transform:
        translate(-50%, -50%)
        rotate(90deg);

    width:100vh;
    height:100vw;

    object-fit:cover;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.10);
    pointer-events:none;
}

</style>

</head>

<body>

<div class="container">

```
<video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>
```

</div>

</body>
</html>
